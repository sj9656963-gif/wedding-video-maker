# main 브랜치에 올릴 때마다 검사(단위 테스트)·빌드한 뒤 GitHub Pages에 배포.
# 처음 한 번: 저장소 설정 → Pages → Source를 'GitHub Actions'로 선택해야 함.
# 액션은 버전 태그가 바뀌어도 영향받지 않도록 커밋 번호로 고정.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치면 진행 중인 배포는 끝까지 두고, 대기 중인 것 중 마지막 것만 실행
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.9.0'
          # 배포 권한이 있는 흐름이라 의존성 캐시는 쓰지 않음 (캐시 오염 방지)
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
